<!-- ==========================================================================
     GEEK NOOK — Global Enhancements Script for Tilda (Header / Footer T123)
     Includes:
     1. Spotlight Command Palette (⌘K / Ctrl+K)
     2. Micro-Haptics Tactile Audio Synthesizer (Web Audio API)
     3. Smooth scroll handling for Anchor Links (#boards, #configurator, etc.)
     ========================================================================== -->

<div id="gn-global-spotlight" class="gn-spotlight-modal" style="display:none;">
  <div class="gn-spotlight-backdrop" onclick="gnGlobal.closeSpotlight()"></div>
  <div class="gn-spotlight-panel">
    <div class="gn-spotlight-input-row">
      <svg class="gn-spotlight-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="gnSpotlightInput" class="gn-spotlight-input" placeholder="Поиск по сайту, товарам и командам (напр. 'дуб', 'наушники', '3d')..." oninput="gnGlobal.onSpotlightSearch(this.value)" />
      <span class="gn-spotlight-esc-hint" onclick="gnGlobal.closeSpotlight()">ESC</span>
    </div>
    <div class="gn-spotlight-results" id="gnSpotlightResults">
      <!-- Injected by JS -->
    </div>
    <div class="gn-spotlight-footer">
      <span>Навигация: <kbd>↑</kbd> <kbd>↓</kbd></span>
      <span>Выбрать: <kbd>↵</kbd></span>
      <span>Звук кликов: <kbd>S</kbd></span>
    </div>
  </div>
</div>

<style>
  .gn-spotlight-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999999;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
    box-sizing: border-box;
  }

  .gn-spotlight-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 10, 14, 0.78);
    backdrop-filter: blur(10px);
  }

  .gn-spotlight-panel {
    position: relative;
    width: 100%;
    max-width: 620px;
    background: #15181e;
    border: 1px solid #282f3d;
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    animation: gnSpotlightSlide 0.2s ease-out;
  }

  @keyframes gnSpotlightSlide {
    from { opacity: 0; transform: translateY(-16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .gn-spotlight-input-row {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #222733;
    gap: 12px;
  }

  .gn-spotlight-search-icon {
    color: #8b949e;
    flex-shrink: 0;
  }

  .gn-spotlight-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
  }

  .gn-spotlight-esc-hint {
    background: #212631;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: monospace;
    color: #8b949e;
    cursor: pointer;
  }

  .gn-spotlight-results {
    max-height: 360px;
    overflow-y: auto;
    padding: 8px;
  }

  .gn-spotlight-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease;
  }

  .gn-spotlight-item:hover, .gn-spotlight-item.active {
    background: #1e2430;
  }

  .gn-spotlight-item-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .gn-spotlight-item-title {
    font-size: 14px;
    font-weight: 500;
    color: #fff;
  }

  .gn-spotlight-item-badge {
    background: #252b37;
    color: #60a5fa;
    font-size: 11px;
    font-family: monospace;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .gn-spotlight-footer {
    display: flex;
    justify-content: space-between;
    padding: 10px 18px;
    background: #0f1115;
    border-top: 1px solid #1e232d;
    font-size: 12px;
    color: #7d8590;
  }

  .gn-spotlight-footer kbd {
    background: #1b1f27;
    border: 1px solid #2e3543;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: monospace;
    color: #c9d1d9;
  }
</style>

<script>
(function() {
  'use strict';

  // --- 1. MICRO-HAPTICS AUDIO ENGINE (Native Web Audio API) ---
  const soundEngine = {
    ctx: null,
    enabled: true,
    init() {
      if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
    },
    click() {
      if (!this.enabled) return;
      try {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.025);

        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.025);
      } catch (e) {}
    }
  };

  // Global click sound listener for buttons and interactive items
  document.addEventListener('click', (e) => {
    if (e.target.closest('button, .t-btn, .gn-cfg-finish-card, .gn-cfg-addon-item, .gn-ergo-chip, a[href^="#"]')) {
      soundEngine.click();
    }
  }, { passive: true });

  // --- 2. SPOTLIGHT COMMAND PALETTE ---
  const COMMANDS = [
    { title: 'Focus Station 3D Конфигуратор', target: '#gn-config-widget-root', badge: '3D LAB' },
    { title: 'FEA Stress Test Lab (Сопромат)', target: '#gn-fea-widget-root', badge: 'PHYSICS' },
    { title: 'Калькулятор эргономики ISO 9241-5', target: '#gn-ergo-widget-root', badge: 'CALC' },
    { title: 'Каталог подставок Focus Station', target: '#boards', badge: 'STORE' },
    { title: 'Модульные аксессуары T-Track', target: '#accessories', badge: 'ACCESSORIES' },
    { title: 'Премиальные шерстяные коврики', target: '#mats', badge: 'DESK MATS' },
    { title: 'Инженерные комплекты (-15%)', target: '#bundles', badge: 'SETS' },
    { title: 'Открыть корзину Тильды', action: 'openCart', badge: 'CART' },
    { title: 'Переключить тактильный звук (Вкл/Выкл)', action: 'toggleSound', badge: 'AUDIO' }
  ];

  function openSpotlight() {
    const modal = document.getElementById('gn-global-spotlight');
    const input = document.getElementById('gnSpotlightInput');
    if (modal) {
      modal.style.display = 'flex';
      renderResults(COMMANDS);
      if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 50);
      }
    }
  }

  function closeSpotlight() {
    const modal = document.getElementById('gn-global-spotlight');
    if (modal) modal.style.display = 'none';
  }

  function renderResults(items) {
    const wrap = document.getElementById('gnSpotlightResults');
    if (!wrap) return;
    if (!items.length) {
      wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#8b949e;font-size:14px;">Ничего не найдено</div>';
      return;
    }
    wrap.innerHTML = items.map((item, idx) => `
      <div class="gn-spotlight-item ${idx === 0 ? 'active' : ''}" onclick="gnGlobal.executeCommand(${idx})">
        <div class="gn-spotlight-item-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          <span class="gn-spotlight-item-title">${item.title}</span>
        </div>
        <span class="gn-spotlight-item-badge">${item.badge}</span>
      </div>
    `).join('');
  }

  let currentFiltered = COMMANDS;

  function onSearch(query) {
    const q = (query || '').toLowerCase().trim();
    if (!q) {
      currentFiltered = COMMANDS;
    } else {
      currentFiltered = COMMANDS.filter(c => c.title.toLowerCase().includes(q) || c.badge.toLowerCase().includes(q));
    }
    renderResults(currentFiltered);
  }

  function executeCommand(idx) {
    const cmd = currentFiltered[idx];
    if (!cmd) return;
    closeSpotlight();

    if (cmd.action === 'openCart') {
      if (typeof window.tcart__openCart === 'function') window.tcart__openCart();
      else alert('Корзина Тильды открыта');
    } else if (cmd.action === 'toggleSound') {
      soundEngine.enabled = !soundEngine.enabled;
      alert(`Звук обратной связи: ${soundEngine.enabled ? 'Включен' : 'Выключен'}`);
    } else if (cmd.target) {
      const el = document.querySelector(cmd.target);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
      } else {
        window.location.hash = cmd.target;
      }
    }
  }

  // KEYBOARD SHORTCUTS (⌘K / Ctrl+K, ESC, S)
  document.addEventListener('keydown', (e) => {
    // ⌘K or Ctrl+K
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'л' || e.key === 'K')) {
      e.preventDefault();
      const modal = document.getElementById('gn-global-spotlight');
      if (modal && modal.style.display !== 'none') closeSpotlight();
      else openSpotlight();
    }
    // ESC
    if (e.key === 'Escape') {
      closeSpotlight();
    }
    // S (toggle sound when not typing in input)
    if ((e.key === 's' || e.key === 'ы') && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      soundEngine.enabled = !soundEngine.enabled;
      soundEngine.click();
    }
  });

  window.gnGlobal = {
    openSpotlight,
    closeSpotlight,
    onSpotlightSearch: onSearch,
    executeCommand,
    soundEngine
  };

})();
</script>
