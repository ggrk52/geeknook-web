<!-- ==========================================================================
     GEEK NOOK — Dedicated Legal Center Loader for Tilda (Block T123)
     Allows hosting https://geeknook.ru/legal or https://legal.geeknook.ru directly on Tilda
     Fetches and mounts the official Legal Portal seamlessly from CDN
     ========================================================================== -->

<div id="geeknook-legal-root">
  <div id="gn-legal-loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0d11;color:#2b70f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:sans-serif;">
    <div style="width:40px;height:40px;border:3px solid #1e2430;border-top-color:#2b70f0;border-radius:50%;animation:gnSpin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;font-size:13px;letter-spacing:0.1em;color:#94a3b8;">GEEK NOOK // ПРАВОВОЙ ЦЕНТР...</div>
  </div>
</div>

<style>
  @keyframes gnSpin { to { transform: rotate(360deg); } }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #0b0d11 !important;
    overflow-x: hidden !important;
  }
  .r:has(#geeknook-legal-root),
  .t123:has(#geeknook-legal-root),
  .t-container_100:has(#geeknook-legal-root),
  .t-col_100:has(#geeknook-legal-root) {
    max-width: 100% !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
</style>

<script>
(async function() {
  'use strict';
  const CDN_BASE = 'https://ggrk52.github.io/geeknook-web/';
  const currentHash = window.location.hash;
  try {
    const res = await fetch(CDN_BASE + 'legal.html?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
    if (currentHash && window.location.hash !== currentHash) {
      window.location.hash = currentHash;
    }
  } catch(err) {
    console.warn('[GeekNook Legal] Direct rewrite failed, redirecting to CDN:', err);
    window.location.replace(CDN_BASE + 'legal.html' + currentHash);
  }
})();
</script>
