<!-- ==========================================================================
     GEEK NOOK — Dedicated Journal Loader for Tilda (Block T123)
     Allows hosting https://geeknook.ru/journal directly on Tilda
     Fetches and mounts all 218 articles seamlessly from GitHub Pages CDN
     Supports direct server-side pre-rendered delivery for crawlers & browsers
     ========================================================================== -->

<div id="geeknook-journal-root">
  <div id="gn-journal-loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0d11;color:#2b70f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:sans-serif;">
    <div style="width:40px;height:40px;border:3px solid #1e2430;border-top-color:#2b70f0;border-radius:50%;animation:gnSpin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;font-size:13px;letter-spacing:0.1em;color:#94a3b8;">GEEK NOOK // ЗАГРУЗКА ЖУРНАЛА...</div>
  </div>
</div>

<style>
  @keyframes gnSpin { to { transform: rotate(360deg); } }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #0c0c0e !important;
    overflow-x: hidden !important;
  }
  .r:has(#geeknook-journal-root),
  .t123:has(#geeknook-journal-root),
  .t-container_100:has(#geeknook-journal-root),
  .t-col_100:has(#geeknook-journal-root) {
    max-width: 100% !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
</style>

<script>
(async function() {
  'use strict';
  const CDN_BASE = 'https://ggrk52.github.io/geeknook-web/';
  
  function rewriteAssets(html) {
    // Rewrite relative assets to CDN absolute URLs
    html = html.replace(/(href|src)=["']((?:js|css|images|docs)\/[^"']+)["']/gi, (m, attr, path) => `${attr}="${CDN_BASE}${path}"`);
    html = html.replace(/(href|src)=["']\.\.\/((?:js|css|images|docs)\/[^"']+)["']/gi, (m, attr, path) => `${attr}="${CDN_BASE}${path}"`);
    html = html.replace(/href=["'](?:\.\.\/)?favicon\.ico["']/gi, `href="${CDN_BASE}favicon.ico"`);
    return html;
  }

  function renderPage(html) {
    document.open();
    document.write(rewriteAssets(html));
    document.close();
  }

  try {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('article');
    
    // If an article slug is in URL (?article=slug), fetch static article directly
    if (slug && /^[a-z0-9-]+$/.test(slug)) {
      try {
        const articleRes = await fetch(CDN_BASE + 'journal/' + slug + '.html?v=' + Date.now() + '_' + Math.random().toString(36).slice(2), { cache: 'no-store' });
        if (articleRes.ok) {
          const articleHtml = await articleRes.text();
          renderPage(articleHtml);
          return;
        }
      } catch (e) {
        console.warn('[GeekNook Journal] Direct article fetch failed, falling back to shell:', e);
      }
    }

    // Default: fetch main journal shell with 218 articles catalogue
    const res = await fetch(CDN_BASE + 'journal.html?v=' + Date.now() + '_' + Math.random().toString(36).slice(2), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const html = await res.text();
    renderPage(html);
  } catch(err) {
    console.warn('[GeekNook Journal] Direct rewrite failed, redirecting to CDN:', err);
    window.location.replace(CDN_BASE + 'journal.html' + window.location.search);
  }
})();
</script>
