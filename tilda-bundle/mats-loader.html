<!-- ==========================================================================
     GEEK NOOK — Desk Mats Landing Loader for Tilda (Block T123)
     Allows hosting https://geeknook.ru/kovriki-dlya-stola directly on Tilda
     Fetches and mounts the SEO landing page seamlessly from GitHub Pages CDN
     ========================================================================== -->

<div id="geeknook-mats-root">
  <div id="gn-mats-loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0d11;color:#2b70f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:sans-serif;">
    <div style="width:40px;height:40px;border:3px solid #1e2430;border-top-color:#2b70f0;border-radius:50%;animation:gnSpin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;font-size:13px;letter-spacing:0.1em;color:#94a3b8;">GEEK NOOK // ЗАГРУЗКА КАТАЛОГА КОВРИКОВ...</div>
  </div>
</div>

<style>
  @keyframes gnSpin { to { transform: rotate(360deg); } }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #0b0d11 !important;
    overflow-x: hidden !important;
  }
  .r:has(#geeknook-mats-root),
  .t123:has(#geeknook-mats-root),
  .t-container_100:has(#geeknook-mats-root),
  .t-col_100:has(#geeknook-mats-root) {
    max-width: 100% !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
</style>

<script>
(async function() {
  'use strict';
  const CDN_BASE = 'https://ggrk52.github.io/geeknook-web/';
  try {
    const res = await fetch(CDN_BASE + 'kovriki-dlya-stola.html?v=' + Date.now() + '_' + Math.random().toString(36).slice(2), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let html = await res.text();
    html = html.replace(/(href|src)=["']((?:js|css|images|docs)\/[^"']+)["']/gi, (m, attr, path) => `${attr}="${CDN_BASE}${path}"`);
    html = html.replace(/href=["']favicon\.ico["']/gi, `href="${CDN_BASE}favicon.ico"`);
    document.open();
    document.write(html);
    document.close();
  } catch(err) {
    console.warn('[GeekNook Mats] Direct rewrite failed, redirecting to CDN:', err);
    window.location.replace(CDN_BASE + 'kovriki-dlya-stola.html');
  }
})();
</script>
