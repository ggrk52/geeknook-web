<!-- ==========================================================================
     GEEK NOOK — Universal Headless Loader for Tilda (Block T123)
     Loads 100% of the GeekNook site into Tilda while connecting native:
     • Tilda Cart (ST100 / tcart)
     • Payment Gateways (YooKassa, Tinkoff, Sber, SBP, Dolame)
     • Delivery calculation (CDEK)
     • Tilda CRM & Telegram Lead Generation
     ========================================================================== -->

<div id="geeknook-mount-point" class="geeknook-tilda-wrapper">
  <!-- Loading Skeleton -->
  <div id="gn-site-loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0c0d10;color:#3b82f6;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:sans-serif;">
    <div style="width:40px;height:40px;border:3px solid #1e2430;border-top-color:#3b82f6;border-radius:50%;animation:gnSpin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;font-size:13px;letter-spacing:0.1em;color:#8b949e;">GEEK NOOK // СИСТЕМА ЗАГРУЖАЕТСЯ...</div>
  </div>
</div>

<style>
  @keyframes gnSpin { to { transform: rotate(360deg); } }
  
  /* Reset Tilda Body & Containers for full-screen experience */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #0c0d10 !important;
    overflow-x: hidden !important;
  }

  /* Reset Tilda Block Wrappers */
  .r:has(#geeknook-mount-point),
  .t123:has(#geeknook-mount-point),
  .t-container_100:has(#geeknook-mount-point),
  .t-col_100:has(#geeknook-mount-point) {
    max-width: 100% !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  #geeknook-mount-point {
    width: 100% !important;
    min-height: 100vh;
    display: block;
    position: relative;
    background: #0c0d10;
  }

  /* Ensure Tilda Cart icon stays accessible */
  .t706__carticon {
    z-index: 999999 !important;
  }
</style>

<script>
(function() {
  'use strict';

  // =========================================================================
  // ВАШ АКТУАЛЬНЫЙ АДРЕС САЙТА НА GITHUB PAGES:
  // =========================================================================
  const BASE_URL = window.GEEKNOOK_CDN_URL || 'https://ggrk52.github.io/geeknook-web/';
  window.GEEKNOOK_CDN_URL = BASE_URL;

  // Cache-busting timestamp to prevent browser & Fastly CDN from serving stale scripts
  const BUILD_TS = Date.now();

  // Helper: fix any image element or URL string to point to GitHub Pages CDN
  function resolveAssetUrl(url) {
    if (!url || typeof url !== 'string') return url;
    if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:') || url.startsWith('blob:')) return url;
    const clean = url.replace(/^\.?\//, '');
    return BASE_URL.endsWith('/') ? BASE_URL + clean : BASE_URL + '/' + clean;
  }
  window.getGeekNookAssetUrl = resolveAssetUrl;

  function fixAnyImage(img) {
    if (!img) return;
    const rawSrc = img.getAttribute('src') || '';
    const propSrc = img.src || '';
    const srcToCheck = rawSrc || propSrc;
    if (srcToCheck.includes('images/') && !srcToCheck.includes('github.io')) {
      const clean = srcToCheck.substring(srcToCheck.indexOf('images/')).replace(/^\.?\//, '');
      const newUrl = BASE_URL + clean;
      if (img.src !== newUrl) {
        img.src = newUrl;
      }
    }
  }

  // 1. Global capture error listener: instantly intercepts ANY broken 404 image
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'IMG') {
      fixAnyImage(e.target);
    }
  }, true);

  function loadAsset(type, url) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const done = () => {
        if (!settled) {
          settled = true;
          resolve();
        }
      };

      if (type === 'css') {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = url;
        link.onload = done;
        link.onerror = done;
        setTimeout(done, 300); // Safety timeout: link.onload can hang or be suppressed by browsers
        document.head.appendChild(link);
      } else if (type === 'js') {
        const script = document.createElement('script');
        script.src = url;
        script.onload = done;
        script.onerror = () => {
          console.warn('[GeekNook] Script load error:', url);
          done();
        };
        setTimeout(done, 5000); // Safety timeout for scripts
        document.body.appendChild(script);
      }
    });
  }

  async function mountGeekNook() {
    try {
      // 1. Load Fonts & Main Stylesheet
      await loadAsset('css', 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700&display=swap');
      await loadAsset('css', BASE_URL + 'css/modern-style.css?v=' + BUILD_TS);

      // 2. Fetch HTML template and rewrite static relative paths to CDN
      const htmlRes = await fetch(BASE_URL + 'index.html?v=' + BUILD_TS);
      let htmlText = await htmlRes.text();

      // Pre-rewrite relative images in HTML before DOM parsing
      htmlText = htmlText.replace(/(src|poster|data-src)=["'](images\/[^"']+)["']/gi, (m, attr, path) => `${attr}="${BASE_URL}${path}"`);
      htmlText = htmlText.replace(/openLightbox\(['"](images\/[^'"]+)['"]/gi, (m, path) => `openLightbox('${BASE_URL}${path}'`);

      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');

      // Double-check any remaining elements in parsed tree
      doc.querySelectorAll('img, video, source').forEach(el => {
        ['src', 'poster', 'data-src'].forEach(attr => {
          const val = el.getAttribute(attr);
          if (val && (val.startsWith('images/') || val.startsWith('./images/')) && !val.startsWith('http')) {
            el.setAttribute(attr, resolveAssetUrl(val));
          }
        });
      });

      // Extract body contents (excluding existing scripts)
      const mountPoint = document.getElementById('geeknook-mount-point');
      const bodyChildren = Array.from(doc.body.children).filter(el => el.tagName !== 'SCRIPT');
      
      bodyChildren.forEach(child => {
        mountPoint.appendChild(child);
      });

      // Setup real-time MutationObserver to fix any dynamically injected images
      const observer = new MutationObserver(mutations => {
        for (let i = 0; i < mutations.length; i++) {
          const m = mutations[i];
          for (let j = 0; j < m.addedNodes.length; j++) {
            const node = m.addedNodes[j];
            if (node.nodeType === 1) {
              if (node.tagName === 'IMG') fixAnyImage(node);
              if (node.querySelectorAll) {
                node.querySelectorAll('img').forEach(fixAnyImage);
                node.querySelectorAll('video, source').forEach(el => {
                  ['src', 'poster'].forEach(attr => {
                    const v = el.getAttribute(attr) || el[attr] || '';
                    if (v.includes('images/') && !v.includes('github.io')) {
                      const clean = v.substring(v.indexOf('images/')).replace(/^\.?\//, '');
                      el.setAttribute(attr, BASE_URL + clean);
                      if (el[attr]) el[attr] = BASE_URL + clean;
                    }
                  });
                });
              }
            }
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Periodic sweep for 6 seconds to ensure any async/delayed renderers are caught
      const sweepInterval = setInterval(() => {
        document.querySelectorAll('img').forEach(fixAnyImage);
      }, 250);
      setTimeout(() => clearInterval(sweepInterval), 6000);

      // 3. Sequential Scripts Loading with Cache-Busting
      await loadAsset('js', BASE_URL + 'js/three.min.js');
      await loadAsset('js', BASE_URL + 'js/products-data.js?v=' + BUILD_TS);
      await loadAsset('js', BASE_URL + 'js/modern-app.js?v=' + BUILD_TS);
      await loadAsset('js', BASE_URL + 'js/modules/tilda-adapter.js?v=' + BUILD_TS);

      // Force initial application render in case DOMContentLoaded already fired
      if (window.geekNookApp && typeof window.geekNookApp.init === 'function') {
        window.geekNookApp.init();
      }

      // Ensure theme is active
      if (!document.documentElement.getAttribute('data-theme')) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      // Final sweep after all scripts executed
      setTimeout(() => {
        document.querySelectorAll('img').forEach(fixAnyImage);
      }, 100);

      // 4. Remove Loader
      const loader = document.getElementById('gn-site-loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.4s ease';
        setTimeout(() => loader.remove(), 400);
      }

      console.log('[GeekNook] Successfully mounted on Tilda with Tcart integration & CDN image resolution!');
    } catch (err) {
      console.error('[GeekNook] Failed to mount on Tilda:', err);
      const loader = document.getElementById('gn-site-loader');
      if (loader) {
        loader.innerHTML = `
          <div style="color:#ef4444;font-size:14px;text-align:center;">
            Не удалось загрузить сайт.<br>
            <span style="font-size:12px;color:#8b949e;">Проверьте путь BASE_URL или доступность файлов.</span>
          </div>
        `;
      }
    }
  }

  // Start mount
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountGeekNook);
  } else {
    mountGeekNook();
  }
})();
</script>
