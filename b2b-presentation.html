<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" href="images/tild6164-6364-4661-b835-636430386562__logo_oo.png" type="image/png" />
  <style>
    :root {
      --bg: #090c12;
      --card-bg: #121824;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #2b70f0;
      --accent: #d97706;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
    
    .deck-container {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 4vw, 48px);
      overflow: hidden;
    }

    .slide-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .slide-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1rem; letter-spacing: 0.05em; color: var(--primary); }
    .slide-num { font-size: 0.8125rem; color: var(--muted); font-family: monospace; }
    .slide-title { font-size: clamp(1.4rem, 2.8vw, 2.2rem); font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
    .slide-subtitle { font-size: clamp(0.9rem, 1.4vw, 1.15rem); color: var(--muted); line-height: 1.6; max-width: 860px; margin-bottom: 24px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

    .card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .card-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
    .price-tag { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin: 6px 0; font-family: monospace; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: rgba(43, 112, 240, 0.15); color: var(--primary); margin-bottom: 8px; }
    .badge-amber { background: rgba(217, 119, 6, 0.15); color: var(--accent); }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--success); }

    .slide-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; margin-top: auto; font-size: 0.78rem; color: var(--muted); }

    .deck-nav { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
    .btn-nav { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .btn-nav:hover { background: rgba(255, 255, 255, 0.16); }
    .btn-nav.primary { background: var(--primary); border-color: var(--primary); }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .deck-nav { display: none; }
      .deck-container { box-shadow: none; border: none; aspect-ratio: auto; page-break-after: always; width: 100vw; height: 100vh; padding: 40px; }
    }
  </style>
</head>

      container.innerHTML = `
        <div>
          <div class="slide-header">
            <div class="slide-logo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>

            </div>
            <div class="slide-num">${s.num}</div>
          </div>
          <div class="badge">${s.badge}</div>
          <h1 class="slide-title">${s.title}</h1>
          <p class="slide-subtitle">${s.subtitle}</p>

        </div>
        <div class="slide-footer">
          <span>${s.footer}</span>
          <span>Нажмите ← / → для навигации</span>
        </div>
      `;
      document.getElementById('navCounter').textContent = `${idx + 1} / ${slidesData.length}`;
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    renderSlide(0);
